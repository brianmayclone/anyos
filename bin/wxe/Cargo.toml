[package]
name = "wxe"
version = "0.1.0"
edition = "2021"

[dependencies]
anyos_std = { path = "../../libs/stdlib" }
libwxecore = { path = "../../libs/libwxecore" }

[features]
default = ["anyos-bin"]
anyos-bin = []
host = ["anyos_std/host", "libwxecore/host"]

[[bin]]
name = "wxe"
path = "src/main.rs"
required-features = ["anyos-bin"]

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
