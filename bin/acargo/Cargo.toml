[package]
name = "acargo"
version = "0.1.0"
edition = "2021"

[features]
host = [
  "anyrc/host",
  "anyos_std/host",
  "dynlink/host",
  "libhttp_client/host",
  "libzip_client/host",
]

[lib]
name = "acargo"
path = "src/lib.rs"

[[bin]]
name = "ccargo"
path = "src/main.rs"

[dependencies]
anyrc = { path = "../../libs/anyrc" }
anyos_std = { path = "../../libs/stdlib" }
dynlink = { path = "../../libs/dynlink" }
libhttp_client = { path = "../../libs/libhttp_client" }
libzip_client = { path = "../../libs/libzip_client" }

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
