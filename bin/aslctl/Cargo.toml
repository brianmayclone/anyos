[package]
name = "aslctl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aslctl"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "linux")'.dependencies]
anyos_std = { path = "../../libs/stdlib", features = ["host"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
anyos_std = { path = "../../libs/stdlib" }
