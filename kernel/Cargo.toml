[package]
name = "anyos_kernel"
version = "0.1.0"
edition = "2021"

[features]
default = []
debug_verbose = []
# Enable in-kernel KUnit self-tests.  Tests run during boot after heap init
# and report results via serial output.  Never enable in production builds.
kunit = []

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 2
lto = "thin"
