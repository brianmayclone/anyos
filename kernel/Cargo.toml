[package]
name = "anyos_kernel"
version = "0.1.0"
edition = "2021"

[features]
default = []
debug_verbose = []
# Enable in-kernel KUnit self-tests.  Tests run during boot after heap init
# and report results via serial output.  Never enable in production builds.
kunit = []
# Use the buddy allocator (memory::buddy) as the backend for
# memory::physical::alloc_frame / alloc_contiguous / free_frame.
# Default is the legacy bitmap allocator; flip this on to validate
# the new backend before retiring the bitmap.
buddy_alloc = []

[dependencies]
# Plattformneutraler CoreFS-Kern als Path-Dependency. `default-features = false`
# deaktiviert das `crypto`-Feature (chacha20poly1305 / poly1305 mit SIMD-Intrinsics
# bauen nicht für den soft-float Kernel-Target). AnyOS bringt seine eigenen
# `Clock`/`Rng`-Implementierungen über die `corefs_core::platform`-Traits mit.
corefs-core = { path = "../../corefs/corefs-core", default-features = false }
# Wire-Typen für das In-Kernel-FUSE-Subsystem (Request/Reply-Enums +
# bincode-legacy Encode/Decode). `default-features = false` hält die Crate
# im no_std-Modus.
corefs-fuse-proto = { path = "../../corefs/corefs-fuse-proto", default-features = false }
# bincode-legacy als Wire-Codec für corefs-fuse-proto. Versionen spiegeln die
# in corefs-fuse-proto/Cargo.toml verwendeten Features.
bincode = { version = "2.0", default-features = false, features = ["alloc", "serde"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 2
lto = "thin"
