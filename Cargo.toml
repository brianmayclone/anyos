[workspace]
members = [
  "kernel",
  # All user-space programs (built together via cargo build --workspace)
  "bin/*",
  "apps/*",
  "system/init",
  "system/svc",
  "system/textmode_console",
  "system/daemons/amid",
  "system/daemons/confd",
  "system/daemons/crond",
  "system/daemons/dnsd",
  "system/daemons/ftpd",
  "system/daemons/httpd",
  "system/daemons/logd",
  "system/daemons/networkd",
  "system/daemons/notifyd",
  "system/daemons/ntpd",
  "system/daemons/searchd",
  "system/daemons/vdagent",
  "system/daemons/vncd",
  "system/compositor/anybout",
  "system/compositor/audiomon",
  "system/compositor/finder",
  "system/compositor/inputmon",
  "system/compositor/login",
  "system/compositor/netmon",
  "system/compositor/permdialog",
  "system/compositor/settings",
  "system/compositor/wifimon",
  "system/utilities/amiconsole",
  "system/utilities/backuprestore",
  "system/utilities/configexplorer",
  "system/utilities/anytrace",
  "system/utilities/diskutil",
  "system/utilities/eventviewer",
  "system/utilities/runner",
  "system/utilities/shell",
  "system/utilities/servicemanager",
  "system/utilities/taskmanager",
  "system/utilities/terminal",
  "system/compositor/compositor",
]
exclude = [
  # Libraries (dependencies only, not build targets)
  "libs/*",
  # Dock uses kernel target (x86_64-anyos.json), built separately
  "system/compositor/dock",
  # Standalone system programs (own workspace, kernel target, built separately)
  "system/daemons/fontd",
  "system/daemons/desktopd",
  "system/compositor/sessionhost",
  "system/compositor/crashdialog",
  # UEFI bootloader uses x86_64-unknown-uefi target, built separately
  "bootloader/uefi",
  # Non-Rust directories (C programs, placeholder stubs)
  "bin/git",
  "bin/make",
  "bin/ssh",
  "bin/sshd",
  # Legacy per-program build output directories; the real daemons live under system/.
  "bin/crond",
  "bin/ftpd",
  "bin/httpd",
  "bin/logd",
  "bin/ntpd",
  "bin/svc",
  "bin/vdagent",
  "bin/vncd",
  # Host-native tools (built with cargo +stable, not part of anyOS image)
  "tools/surf-host",
  "tools/test262-runner",
  "tools/mkfs-corefs-host",
]
resolver = "2"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
