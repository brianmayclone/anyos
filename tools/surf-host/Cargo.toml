[package]
name = "surf-host"
version = "0.1.0"
edition = "2021"

[features]
debug_surf = ["libwebview/debug_surf"]

[dependencies]
libwebview = { path = "../../libs/libwebview", features = ["host"] }
libfont_client = { path = "../../libs/libfont_client", features = ["host"] }
libfont = { path = "../../libs/libfont", features = ["host"], default-features = false }
libanyui_client = { path = "../../libs/libanyui_client", features = ["host"] }
anyos_std = { path = "../../libs/stdlib", features = ["host"] }
libjs = { path = "../../libs/libjs", features = ["host"] }

libimage = { path = "../../libs/libimage", features = ["host"] }

# Host-native dependencies
minifb = "0.28"
eframe = { version = "0.27", default-features = true }
ureq = { version = "2", features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
resvg = "0.45"

# Standalone project — not part of the anyOS workspace.
# Build with: cargo +stable build --release

[[bin]]
name = "jpeg-corpus"
path = "src/jpeg_corpus.rs"

[[bin]]
name = "webp-compare"
path = "src/webp_compare.rs"

[[bin]]
name = "parse-test"
path = "src/parse_test.rs"

[workspace]
[[bin]]
name = "decode-one"
path = "/tmp/decode_one.rs"
