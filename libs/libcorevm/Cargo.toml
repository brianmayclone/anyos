[package]
name = "libcorevm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["anyos"]
anyos = ["libheap", "libsyscall"]
host_test = []
linux = ["std"]
windows = ["std"]
std = []

[dependencies]
libheap = { path = "../libheap", optional = true }
libsyscall = { path = "../libsyscall", optional = true }

[workspace]
