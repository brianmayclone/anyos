[package]
name = "libhttp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
libdns = { path = "../libdns" }
libheap = { path = "../libheap" }
libsyscall = { path = "../libsyscall" }
libtls = { path = "../libtls" }
libzip = { path = "../libzip", features = ["embedded"] }

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"

[workspace]
