[package]
name = "libzip_so"
version = "0.1.0"
edition = "2021"

[features]
host = []
embedded = []

[lib]
name = "libzip"
path = "../libzip/src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
libheap = { path = "../libheap" }
libsyscall = { path = "../libsyscall" }

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"

[workspace]
