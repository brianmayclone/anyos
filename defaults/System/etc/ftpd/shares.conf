# anyOS FTP Shares Configuration
# Format: username:path:permissions  (r=read, w=write, *=all users)
# Examples:
#   *:/users/shared/ftp:r     All users read-only access to /users/shared/ftp
#   alice:/home/alice:rw      alice has full access to /home/alice
#   bob:/home/bob:rw          bob has full access to /home/bob
*:/users/shared/ftp:r
