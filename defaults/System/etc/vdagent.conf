# anyOS SPICE vdagent configuration (reference)
#
# This file is reference documentation only — vdagent reads its configuration
# from confd at /services/vdagent/config (registered automatically on first run).
#
# To change values at runtime, use confctl:
#
#   confctl get  /services/vdagent/config/enabled
#   confctl set  /services/vdagent/config/port_name      "com.redhat.spice.0"
#   confctl set  /services/vdagent/config/log_level      "debug"
#   confctl set  /services/vdagent/config/clipboard_poll_ms  500
#
# The keys below mirror the confd defaults installed by libconf_schema.

# Master enable. When false, the daemon exits cleanly at startup.
enabled=yes

# Host-side virtio-serial port name. Standard SPICE setups use the
# canonical "com.redhat.spice.0" channel announced by spicevmc.
port_name=com.redhat.spice.0

# Explicit kernel device path. Leave empty to derive from port_name as
# /dev/virtio-ports/<port_name>. Override only for unusual layouts.
device_path=

# How often (ms) to poll the compositor clipboard for local changes.
# 500 ms keeps host-sync latency bounded without burning CPU.
clipboard_poll_ms=500

# Idle main-loop sleep (ms). Lower = lower input-event latency.
idle_sleep_ms=50

# Log verbosity: error | warn | info | debug | trace
log_level=info

# Maximum clipboard payload accepted from the host (bytes). Hard ceiling.
max_clipboard_bytes=65536
