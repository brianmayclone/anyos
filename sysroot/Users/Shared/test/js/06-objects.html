<!DOCTYPE html>
<html>
<head>
<title>JS Test: Objects</title>
<style>
  body { background: #1a1a2e; color: #e0e0e0; font-family: sans-serif; margin: 0; padding: 20px; }
  .nav { margin-bottom: 20px; }
  .nav a { color: #4ecdc4; text-decoration: none; margin-right: 15px; }
  h1.page-title { color: #ff6b6b; border-bottom: 2px solid #ff6b6b; padding-bottom: 10px; }
  .test-group { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 8px; background: #16213e; }
  .test-group h2 { color: #4ecdc4; margin-top: 0; font-size: 18px; }
  .expected { color: #6bff6b; font-style: italic; font-size: 14px; margin-bottom: 10px; padding: 8px; background: #1a2a1a; border-radius: 4px; }
  .test-area { padding: 10px; background: #0f3460; border-radius: 4px; }
  .pass { color: #6bff6b; font-weight: bold; }
  .fail { color: #ff6b6b; font-weight: bold; }
  .result { margin: 5px 0; padding: 5px 10px; border-left: 3px solid #333; }
</style>
</head>
<body>
<div class="nav"><a href="../index.html">Index</a></div>
<h1 class="page-title">06 - Objects</h1>

<div class="test-group">
  <h2>Object Operations and Prototypes</h2>
  <div class="expected">Expected: Object creation, property access, Object.keys/values/entries, Object.assign, prototypes, and JSON round-trip all work correctly.</div>
  <div class="test-area" id="results"></div>
</div>

<script>
function test(name, fn) {
  var resultDiv = document.getElementById('results');
  var div = document.createElement('div');
  div.className = 'result';
  try {
    var result = fn();
    if (result === true) {
      div.innerHTML = '<span class="pass">PASS</span> - ' + name;
      div.style.borderLeftColor = '#6bff6b';
    } else {
      div.innerHTML = '<span class="fail">FAIL</span> - ' + name + ' (got: ' + result + ')';
      div.style.borderLeftColor = '#ff6b6b';
    }
  } catch(e) {
    div.innerHTML = '<span class="fail">ERROR</span> - ' + name + ': ' + e;
    div.style.borderLeftColor = '#ff6b6b';
  }
  resultDiv.appendChild(div);
}

// --- Object literal creation ---
test('Object literal creation', function() {
  var obj = { name: 'Alice', age: 30 };
  return obj.name === 'Alice' && obj.age === 30;
});

test('Empty object', function() {
  var obj = {};
  return typeof obj === 'object' && obj !== null;
});

// --- Property access ---
test('Dot notation access', function() {
  var obj = { x: 10, y: 20 };
  return obj.x === 10 && obj.y === 20;
});

test('Bracket notation access', function() {
  var obj = { x: 10, y: 20 };
  return obj['x'] === 10 && obj['y'] === 20;
});

test('Bracket notation with variable key', function() {
  var obj = { foo: 'bar' };
  var key = 'foo';
  return obj[key] === 'bar';
});

test('Accessing non-existent property returns undefined', function() {
  var obj = { a: 1 };
  return obj.b === undefined;
});

// --- Property assignment ---
test('Property assignment: dot notation', function() {
  var obj = {};
  obj.name = 'Bob';
  return obj.name === 'Bob';
});

test('Property assignment: bracket notation', function() {
  var obj = {};
  obj['age'] = 25;
  return obj.age === 25;
});

test('Property reassignment', function() {
  var obj = { val: 1 };
  obj.val = 2;
  return obj.val === 2;
});

// --- delete property ---
test('delete property', function() {
  var obj = { a: 1, b: 2, c: 3 };
  delete obj.b;
  return obj.b === undefined && obj.a === 1 && obj.c === 3;
});

// --- in operator ---
test('in operator: property exists', function() {
  var obj = { a: 1, b: 2 };
  return ('a' in obj) === true;
});

test('in operator: property does not exist', function() {
  var obj = { a: 1 };
  return ('z' in obj) === false;
});

test('in operator: works after delete', function() {
  var obj = { a: 1, b: 2 };
  delete obj.a;
  return ('a' in obj) === false && ('b' in obj) === true;
});

// --- Object.keys, Object.values, Object.entries ---
test('Object.keys: returns array of keys', function() {
  var obj = { x: 1, y: 2, z: 3 };
  var keys = Object.keys(obj);
  return keys.length === 3 && keys.indexOf('x') >= 0 && keys.indexOf('y') >= 0 && keys.indexOf('z') >= 0;
});

test('Object.values: returns array of values', function() {
  var obj = { a: 10, b: 20, c: 30 };
  var vals = Object.values(obj);
  return vals.length === 3 && vals.indexOf(10) >= 0 && vals.indexOf(20) >= 0 && vals.indexOf(30) >= 0;
});

test('Object.entries: returns array of [key, value] pairs', function() {
  var obj = { a: 1, b: 2 };
  var entries = Object.entries(obj);
  return entries.length === 2 && entries[0].length === 2;
});

// --- Object.assign ---
test('Object.assign: merge objects', function() {
  var target = { a: 1 };
  var source = { b: 2, c: 3 };
  var result = Object.assign(target, source);
  return result.a === 1 && result.b === 2 && result.c === 3 && result === target;
});

test('Object.assign: later sources override', function() {
  var result = Object.assign({}, { a: 1 }, { a: 2, b: 3 });
  return result.a === 2 && result.b === 3;
});

test('Object.assign: shallow copy', function() {
  var original = { x: 1, y: 2 };
  var copy = Object.assign({}, original);
  copy.x = 99;
  return original.x === 1 && copy.x === 99;
});

// --- Nested objects ---
test('Nested objects: access', function() {
  var obj = {
    person: {
      name: 'Alice',
      address: {
        city: 'Wonderland'
      }
    }
  };
  return obj.person.name === 'Alice' && obj.person.address.city === 'Wonderland';
});

test('Nested objects: modify', function() {
  var obj = { inner: { val: 1 } };
  obj.inner.val = 42;
  return obj.inner.val === 42;
});

// --- Object.create and prototypes ---
test('Object.create: basic prototype', function() {
  var proto = {
    greet: function() { return 'Hello, ' + this.name; }
  };
  var obj = Object.create(proto);
  obj.name = 'World';
  return obj.greet() === 'Hello, World';
});

test('Object.create: prototype chain', function() {
  var animal = { type: 'animal', speak: function() { return 'generic'; } };
  var dog = Object.create(animal);
  dog.breed = 'labrador';
  dog.speak = function() { return 'woof'; };
  return dog.type === 'animal' && dog.breed === 'labrador' && dog.speak() === 'woof';
});

test('Object.create(null): no prototype', function() {
  var obj = Object.create(null);
  obj.key = 'value';
  return obj.key === 'value' && obj.toString === undefined;
});

// --- Constructor functions / prototype ---
test('Constructor function with prototype', function() {
  function Person(name, age) {
    this.name = name;
    this.age = age;
  }
  Person.prototype.greet = function() {
    return 'Hi, I am ' + this.name;
  };
  var p = new Person('Alice', 30);
  return p.name === 'Alice' && p.age === 30 && p.greet() === 'Hi, I am Alice';
});

test('instanceof operator', function() {
  function Foo() {}
  var f = new Foo();
  return (f instanceof Foo) === true && (f instanceof Object) === true;
});

// --- JSON round-trip ---
test('JSON.stringify and JSON.parse round-trip', function() {
  var obj = { name: 'Alice', age: 30, hobbies: ['coding', 'reading'] };
  var json = JSON.stringify(obj);
  var parsed = JSON.parse(json);
  return parsed.name === 'Alice' && parsed.age === 30 && parsed.hobbies.length === 2 && parsed.hobbies[0] === 'coding';
});

test('JSON round-trip: nested object', function() {
  var obj = { a: { b: { c: 42 } } };
  var parsed = JSON.parse(JSON.stringify(obj));
  return parsed.a.b.c === 42;
});

// --- Object methods ---
test('Object with method (this)', function() {
  var calc = {
    value: 0,
    add: function(n) { this.value += n; return this; },
    get: function() { return this.value; }
  };
  calc.add(5).add(3);
  return calc.get() === 8;
});

test('hasOwnProperty', function() {
  var obj = { a: 1 };
  return obj.hasOwnProperty('a') === true && obj.hasOwnProperty('toString') === false;
});
</script>
</body>
</html>
