# anyOS Installation Script
# Format: INI-style with [step:NAME] sections executed in order.
#
# Actions:
#   partition   - Create MBR partition table on target disk
#   format      - Format target partition as exFAT
#   bootloader  - Write stage1/stage2 bootloader to MBR
#   password    - Set root password on live system (copied with /System)
#   extract     - Extract .tar.gz archive to target path
#   copy        - Recursively copy a directory
#   bootcfg     - Write clean boot.cfg to target
#   finish      - Unmount target, finalize

[header]
name=anyOS
version=0.4

[step:bootloader]
label=Installing bootloader
action=bootloader

[step:partition]
label=Creating partition table
action=partition

[step:format]
label=Formatting filesystem
action=format

[step:password]
label=Setting root password
action=password

[step:system]
label=Installing system files
action=extract
source=/install/system.tar.gz
target=/mnt/target/System

[step:bin]
label=Installing command-line tools
action=extract
source=/install/bin.tar.gz
target=/mnt/target/System/bin

[step:apps]
label=Installing applications
action=extract
source=/install/apps.tar.gz
target=/mnt/target/Applications

[step:libs]
label=Installing libraries
action=extract
source=/install/libs.tar.gz
target=/mnt/target/Libraries

[step:users]
label=Setting up user accounts
action=users

[step:boot]
label=Installing boot files
action=copy
source=/boot
target=/mnt/target/boot

[step:media]
label=Installing media files
action=copy
source=/media
target=/mnt/target/media

[step:bootcfg]
label=Writing boot configuration
action=bootcfg

[step:finish]
label=Finishing installation
action=finish
