[login]
# Programs to launch before the login screen.
# These run early so keyboard layout, etc. are ready at login.
/System/inputmon

[autostart]
# Programs to launch after compositor + dock are ready.
# One path per line. Lines starting with '#' are comments.
/System/Sessionhost
/System/notifyd
/System/netmon
/System/audiomon

[shortcuts]
# Keyboard shortcuts: Modifier+Key=action
# Modifiers: Ctrl, Alt, Shift, Super (combinable with +)
# Keys: A-Z, 0-9, F1-F12, Enter, Space, Delete, etc.
# Actions: app path or built-in (show_desktop, tile_windows)
#
# Examples:
# Ctrl+Alt+T=/Applications/Terminal.app
# Super+D=show_desktop
# Super+E=/Applications/Finder.app
# Ctrl+Alt+Delete=/Applications/diagnostics.app
